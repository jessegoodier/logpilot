suite: test deployment
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: should render deployment with default values
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-logpilot
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr.io/jessegoodier/logpilot:[0-9]+\.[0-9]+\.[0-9]+.*$'
      - notExists:
          path: spec.template.spec.containers[0].command
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-logpilot-config
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "API_KEY"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "no-key"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/logs"
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: should render deployment with custom values
    documentSelector:
      path: kind
      value: Deployment
    set:
      replicaCount: 2
      image.tag: "1.2.3"
      previousPodLogs.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/jessegoodier/logpilot:1.2.3"

  - it: should use existing secret for API key
    documentSelector:
      path: kind
      value: Deployment
    set:
      auth.existingSecret: "my-secret"
      auth.existingSecretKey: "my-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: "my-secret"
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: "my-key"
      - notExists:
          path: spec.template.spec.containers[0].env[0].value

  - it: should use direct API key value when no existing secret
    documentSelector:
      path: kind
      value: Deployment
    set:
      auth.apiKey: "test-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "test-key"

  - it: should set resource limits and requests
    documentSelector:
      path: kind
      value: Deployment
    set:
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "2000m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "256Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "200m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2000m"
