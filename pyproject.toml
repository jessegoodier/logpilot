[project]
name = "logPilot"
version = "0.9.2"
description = "A simple Kubernetes log viewer web app"
requires-python = ">=3.14"
dependencies = [
  "flask>=3.1.3",
  "kubernetes>=37.0.1",
  "requests>=2.34.2",
]
authors = [
  { name = "Jesse Goodier", email = "31039225+jessegoodier@users.noreply.github.com" },
]

[project.optional-dependencies]
dev = [
  "playwright>=1.64.1",
  "gunicorn>=26.2.0",
  "pytest>=9.1.1",
  "pytest-playwright>=0.10.0",
  "ruff>=0.17.2",
  "isort>=9.0.2",
  "packaging>=26.3",
  "bump-my-version>=1.6.7",
  "ruamel-yaml>=0.19.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "e2e: needs a running logPilot instance (TEST_BASE_URL)",
]

# ==== bump-my-version ====

[tool.bumpversion]
current_version = "0.9.2"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/main.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "k8s/deployment.yaml"
search = "value: \"{current_version}\""
replace = "value: \"{new_version}\""

[[tool.bumpversion.files]]
filename = "charts/logpilot/Chart.yaml"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "charts/logpilot/Chart.yaml"
search = "appVersion: {current_version}"
replace = "appVersion: {new_version}"
