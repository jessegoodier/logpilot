name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: |
          gem install bundler jekyll jekyll-readme-index

      - name: Build site
        run: |
          bundle init
          echo 'gem "jekyll", "~> 4.2"' >> Gemfile
          echo 'gem "jekyll-remote-theme"' >> Gemfile
          echo 'gem "jekyll-readme-index"' >> Gemfile
          bundle install
          bundle exec jekyll build -d dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
