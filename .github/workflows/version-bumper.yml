name: Version Bumper

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: version-bumper
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
          enable-cache: true
          activate-environment: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.22.1'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Bump version
        id: version
        run: |
          current=$(uv run bump-my-version show current_version)
          new_version=$(uv run bump-my-version show --increment "${{ inputs.version_type }}" new_version)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new_version (${{ inputs.version_type }})"
          uv run bump-my-version bump "${{ inputs.version_type }}" --allow-dirty

      - name: Refresh lockfile
        run: uv lock

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1

      - name: Test Helm chart
        run: |
          helm unittest charts/logpilot
          helm lint charts/logpilot
          helm template test-release charts/logpilot > /dev/null

      - name: Build docs site
        run: |
          gem install bundler jekyll jekyll-readme-index
          bundle init
          echo 'gem "jekyll", "~> 4.2"' >> Gemfile
          echo 'gem "jekyll-remote-theme"' >> Gemfile
          echo 'gem "jekyll-readme-index"' >> Gemfile
          bundle install
          bundle exec jekyll build -d site

      - name: Package chart and write Helm index
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/indexes
          helm package charts/logpilot --destination dist/

          fetch_index() {
            local url="$1" dest="$2"
            if curl -fsSL "$url" -o "$dest" && grep -q '^apiVersion:' "$dest"; then
              echo "fetched $url"
            else
              echo "no index at $url"
              rm -f "$dest"
            fi
          }
          # The live Pages site can lag the gh-pages branch, and deploy-pages
          # does not write the branch. Union both so a release cannot drop versions.
          fetch_index "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.yaml" /tmp/indexes/branch.yaml
          fetch_index "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.yaml" /tmp/indexes/live.yaml
          if [ ! -f /tmp/indexes/branch.yaml ] && [ ! -f /tmp/indexes/live.yaml ]; then
            echo "No existing Helm index found"
            exit 1
          fi

          uv run python << 'PY'
          from pathlib import Path
          import yaml

          root = Path("/tmp/indexes")

          def load(path: Path):
              if not path.exists():
                  return {"apiVersion": "v1", "entries": {}}
              data = yaml.safe_load(path.read_text()) or {}
              data.setdefault("apiVersion", "v1")
              data.setdefault("entries", {})
              return data

          merged = {"apiVersion": "v1", "entries": {}}
          for name in ("branch.yaml", "live.yaml"):
              for chart, versions in (load(root / name).get("entries") or {}).items():
                  bucket = merged["entries"].setdefault(chart, [])
                  have = {item.get("version") for item in bucket}
                  for item in versions:
                      if item.get("version") not in have:
                          bucket.append(item)
                          have.add(item.get("version"))
          (root / "previous.yaml").write_text(yaml.safe_dump(merged, sort_keys=False))
          found = sorted(
              {
                  item.get("version")
                  for charts in merged["entries"].values()
                  for item in charts
              }
          )
          print("previous", found)
          PY

          helm repo index dist/ \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            --merge /tmp/indexes/previous.yaml
          grep -q "version: ${VERSION}" dist/index.yaml
          cp dist/index.yaml site/index.yaml
          touch site/.nojekyll

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "package=${repo}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.new_version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}
            org.opencontainers.image.description=Kubernetes pod log viewer

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.image.outputs.package }}
        run: |
          set -euo pipefail
          owner_type=$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type)
          if [ "$owner_type" = "Organization" ]; then
            candidates="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
          else
            # GITHUB_TOKEN reads repo-linked packages at /user. A user PAT
            # reads them at /users/{owner}. Try both.
            candidates="/user/packages/container/${PACKAGE} /users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
          fi

          # The package record can lag the registry push.
          base=""
          visibility=""
          for _ in 1 2 3 4 5 6; do
            for candidate in $candidates; do
              if visibility=$(gh api "$candidate" --jq .visibility 2>/dev/null); then
                base="$candidate"
                break
              fi
            done
            if [ -n "$base" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$base" ]; then
            echo "Package record for ${PACKAGE} was not found" >&2
            exit 1
          fi

          echo "Package visibility is ${visibility} (${base})"
          # A package linked to this public repository is already public.
          # GitHub's visibility route 404s for that package, so do not try
          # to change it again.
          if [ "$visibility" = "public" ]; then
            exit 0
          fi

          gh api --method PUT -H "Accept: application/vnd.github+json" "${base}/visibility" -f visibility=public \
            || gh api --method PATCH -H "Accept: application/vnd.github+json" "${base}" -f visibility=public
          visibility=$(gh api "$base" --jq .visibility)
          echo "Package visibility is ${visibility}"
          test "$visibility" = "public"

      - name: Point deployment at the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.new_version }}
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          image = os.environ["IMAGE"]
          path = Path("k8s/deployment.yaml")
          lines = path.read_text().splitlines(keepends=True)
          for index, line in enumerate(lines):
              stripped = line.lstrip()
              if stripped.startswith("image:"):
                  indent = line[: len(line) - len(stripped)]
                  lines[index] = f"{indent}image: {image}\n"
                  path.write_text("".join(lines))
                  break
          else:
              raise SystemExit("image line not found in k8s/deployment.yaml")
          PY
          grep -q "image: ${IMAGE}" k8s/deployment.yaml

      - name: Commit and push version bump
        id: push
        run: |
          git add pyproject.toml uv.lock src charts/logpilot k8s
          git commit -m "Bump version to ${{ steps.version.outputs.new_version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          latest: true
          version: ${{ steps.version.outputs.new_version }}
          tag: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          commitish: ${{ steps.push.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.new_version }}" dist/*.tgz --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
